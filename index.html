<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏆 FIFA World Cup 2026 Central | Live Scores & Schedule</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Visual Anchor Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>

    <!-- Cyberpunk Left Navigation Menu -->
    <nav class="sidebar">
        <div class="brand">
            <i class="fa-solid fa-trophy"></i>
            <span>FIFA 2026</span>
        </div>
        <ul class="nav-menu">
            <li class="menu-item active" data-target="live"><i class="fa-solid fa-satellite-dish"></i> Live Matches</li>
            <li class="menu-item" data-target="upcoming"><i class="fa-solid fa-calendar-days"></i> Upcoming Fixtures</li>
            <li class="menu-item" data-target="past"><i class="fa-solid fa-history"></i> Past Results</li>
        </ul>
    </nav>

    <!-- Main Live Dashboard Arena -->
    <main class="dashboard">
        <header class="dashboard-header">
            <div>
                <h1>World Cup 2026 Live Central</h1>
                <p class="subtitle">United States • Canada • Mexico</p>
            </div>
            <div class="status-pill">
                <span class="pulse-dot"></span>
                <span>Active Real-Time Logic Engine</span>
            </div>
        </header>

        <!-- Live Streaming Section Tab -->
        <section id="live-tab" class="view-panel">
            <h2 class="panel-title">Happening Now</h2>
            <div class="match-grid" id="live-container"></div>
        </section>

        <!-- Upcoming Fixtures Section Tab -->
        <section id="upcoming-tab" class="view-panel hidden">
            <h2 class="panel-title">Upcoming Group Stage Schedule</h2>
            <div class="match-grid" id="upcoming-container"></div>
        </section>

        <!-- Past Completed Matches Section Tab -->
        <section id="past-tab" class="view-panel hidden">
            <h2 class="panel-title">Completed Match Results</h2>
            <div class="match-grid" id="past-container"></div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
