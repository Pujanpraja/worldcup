<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChillCinema — Admin</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#171a21; --accent:#e63946;
    --text:#eef1f5; --muted:#8b93a1; --ok:#3ddc84;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    display:flex; justify-content:center; padding:40px 20px;
  }
  .wrap{ width:100%; max-width:640px; }
  h1{ font-size:24px; margin-bottom:6px; }
  h1 span{ color:var(--accent); }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:28px; }
  .card{
    background:var(--panel); border:1px solid #23262f;
    border-radius:12px; padding:24px; margin-bottom:20px;
  }
  label{ display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input, textarea{
    width:100%; background:#0f1116; border:1px solid #2a2e38;
    border-radius:8px; padding:10px 12px; color:var(--text); font-size:14px;
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:70px; }
  button{
    margin-top:20px; width:100%; padding:12px;
    background:var(--accent); border:none; border-radius:8px;
    color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  button.secondary{ background:transparent; border:1px solid #2a2e38; color:var(--muted); }
  #status{ margin-top:14px; font-size:13px; white-space:pre-wrap; }
  #status.ok{ color:var(--ok); }
  #status.err{ color:var(--accent); }
  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid #23262f; font-size:14px;
  }
  .list-item:last-child{ border-bottom:none; }
  .list-item button{
    width:auto; margin:0; padding:6px 12px; font-size:12px;
    background:transparent; border:1px solid #2a2e38; color:var(--muted);
  }
  .list-item button:hover{ color:var(--accent); border-color:var(--accent); }
  small.hint{ color:var(--muted); display:block; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Chill<span>Cinema</span> Admin</h1>
  <p class="sub">Add or delete custom streaming entries directly to your GitHub repository storage.</p>

  <div class="card">
    <label>Repository <small class="hint">Format: owner/repo, e.g. Pujanpraja/worldcup</small></label>
    <input id="repo" value="Pujanpraja/worldcup" placeholder="owner/repo">

    <label style="margin-top: 10px;">Branch</label>
    <input id="branch" value="main" placeholder="main">

    <label style="margin-top: 10px;">File Path <small class="hint">Path to the JSON file inside the repo</small></label>
    <input id="filepath" value="movies.json" placeholder="movies.json">

    <label style="margin-top: 14px;">Personal Access Token <small class="hint">Fine-grained token with Content: Read & Write</small></label>
    <input id="token" type="password" placeholder="github_pat_...">

    <button class="secondary" onclick="connect()">Connect &amp; Sync Library</button>
    <div id="status"></div>
  </div>

  <div class="card" id="add-card" style="display:none;">
    <label>Title</label>
    <input id="title" placeholder="Movie title">

    <label>Video Player URL / YouTube ID</label>
    <input id="youtubeId" placeholder="https://yapgrid.com... OR YouTube code">

    <label>Card Poster Image URL (Optional)</label>
    <input id="thumbnailUrl" placeholder="https://example.com">

    <label>Description (Optional)</label>
    <textarea id="description" placeholder="Short display overview..."></textarea>

    <button onclick="addMovie()" id="add-btn">Publish to Library</button>
  </div>

  <div class="card" id="list-card" style="display:none;">
    <label style="margin-top:0;">Current Catalog Entries</label>
    <div id="movie-list"></div>
  </div>
</div>

<script>
  let sha = null;
  let movies = [];

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type || '';
  }

  function ghHeaders() {
    const token = document.getElementById('token').value.trim();
    // Fine-grained PATs (github_pat_...) use "Bearer"; classic PATs (ghp_...) use "token"
    const headerPrefix = token.startsWith('github_pat_') ? 'Bearer ' : 'token ';
    return {
      'Authorization': headerPrefix + token,
      'Accept': 'application/vnd.github+json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  function getConfig() {
    const repo = document.getElementById('repo').value.trim();
    const branch = document.getElementById('branch').value.trim() || 'main';
    const filepath = document.getElementById('filepath').value.trim() || 'movies.json';
    return { repo, branch, filepath };
  }

  function apiUrl() {
    const { repo, filepath } = getConfig();
    // filepath may contain slashes; encode each segment but keep the slashes
    const encodedPath = filepath.split('/').map(encodeURIComponent).join('/');
    return `https://api.github.com/repos/${repo}/contents/${encodedPath}`;
  }

  async function connect() {
    const { repo, branch, filepath } = getConfig();
    if (!repo || !repo.includes('/')) {
      setStatus('Enter a repository in the form owner/repo.', 'err');
      return;
    }
    const token = document.getElementById('token').value.trim();
    if (!token) {
      setStatus('Enter a Personal Access Token first.', 'err');
      return;
    }

    setStatus('Connecting to GitHub repository API...');
    try {
      const res = await fetch(`${apiUrl()}?ref=${encodeURIComponent(branch)}`, { headers: ghHeaders() });

      if (res.status === 404) {
        // File doesn't exist yet — treat as an empty catalog we can create on first save
        sha = null;
        movies = [];
        renderList();
        document.getElementById('add-card').style.display = 'block';
        document.getElementById('list-card').style.display = 'block';
        setStatus(`No "${filepath}" found yet on ${repo}@${branch} — it will be created on your first save.`, 'ok');
        return;
      }

      if (!res.ok) {
        const errBody = await res.json().catch(() => ({}));
        throw new Error(`API error ${res.status}${errBody.message ? ': ' + errBody.message : ''}`);
      }

      const data = await res.json();
      sha = data.sha;
      movies = data.content ? JSON.parse(decodeURIComponent(escape(atob(data.content)))) : [];
      renderList();
      document.getElementById('add-card').style.display = 'block';
      document.getElementById('list-card').style.display = 'block';
      setStatus('Successfully synced ' + movies.length + ' movie entries.', 'ok');
    } catch (e) {
      setStatus('Sync Connection Failed: ' + e.message, 'err');
    }
  }

  function renderList() {
    const el = document.getElementById('movie-list');
    el.innerHTML = movies.length === 0 ? '<p style="color:var(--muted);font-size:13px;">No entries available.</p>' : '';
    movies.forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `<span>${escapeHtml(m.title)}</span>`;
      const btn = document.createElement('button');
      btn.textContent = 'Delete';
      btn.onclick = () => removeMovie(i);
      row.appendChild(btn);
      el.appendChild(row);
    });
  }

  async function commit(commitMessage) {
    const { branch } = getConfig();
    const body = {
      message: commitMessage,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(movies, null, 2)))),
      branch: branch
    };
    if (sha) body.sha = sha; // omit sha when creating the file for the first time

    const res = await fetch(apiUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      throw new Error(`Upload failed (${res.status})${errBody.message ? ': ' + errBody.message : ''}`);
    }
    const data = await res.json();
    sha = data.content.sha;
  }

  async function addMovie() {
    const title = document.getElementById('title').value.trim();
    const youtubeId = document.getElementById('youtubeId').value.trim();
    const thumbnailUrl = document.getElementById('thumbnailUrl').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!title || !youtubeId) { setStatus('Title and Video resource elements are mandatory.', 'err'); return; }

    const btn = document.getElementById('add-btn');
    btn.disabled = true;
    setStatus('Pushing update to GitHub...');

    movies.push({ id: 'm-' + Date.now(), title, youtubeId, thumbnailUrl, description, addedAt: new Date().toISOString().slice(0,10) });

    try {
      await commit(`Add entry: "${title}"`);
      renderList();
      document.getElementById('title').value = '';
      document.getElementById('youtubeId').value = '';
      document.getElementById('thumbnailUrl').value = '';
      document.getElementById('description').value = '';
      setStatus('Success! Changes propagate globally within 1 minute.', 'ok');
    } catch (e) {
      movies.pop();
      setStatus('Write access failed: ' + e.message, 'err');
    } finally { btn.disabled = false; }
  }

  async function removeMovie(index) {
    const removed = movies[index];
    movies.splice(index, 1);
    try {
      await commit(`Remove entry: "${removed.title}"`);
      renderList();
      setStatus('Removed successfully.', 'ok');
    } catch (e) {
      movies.splice(index, 0, removed);
      renderList();
      setStatus('Removal request failed: ' + e.message, 'err');
    }
  }

  function escapeHtml(str) {
    return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  }
</script>
</body>
</html>
