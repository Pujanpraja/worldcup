<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChillCinema — Admin</title>
<style>
  :root{
    --bg:#0d0f14; --panel:#171a21; --accent:#e63946;
    --text:#eef1f5; --muted:#8b93a1; --ok:#3ddc84;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    display:flex; justify-content:center; padding:40px 20px;
  }
  .wrap{ width:100%; max-width:640px; }
  h1{ font-size:24px; margin-bottom:6px; }
  h1 span{ color:var(--accent); }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:28px; }
  .card{
    background:var(--panel); border:1px solid #23262f;
    border-radius:12px; padding:24px; margin-bottom:20px;
  }
  label{ display:block; font-size:13px; color:var(--muted); margin:14px 0 6px; }
  input, textarea{
    width:100%; background:#0f1116; border:1px solid #2a2e38;
    border-radius:8px; padding:10px 12px; color:var(--text); font-size:14px;
    font-family:inherit;
  }
  textarea{ resize:vertical; min-height:70px; }
  button{
    margin-top:20px; width:100%; padding:12px;
    background:var(--accent); border:none; border-radius:8px;
    color:#fff; font-size:15px; font-weight:600; cursor:pointer;
  }
  button:disabled{ opacity:0.5; cursor:not-allowed; }
  button.secondary{ background:transparent; border:1px solid #2a2e38; color:var(--muted); }
  #status{ margin-top:14px; font-size:13px; white-space:pre-wrap; }
  #status.ok{ color:var(--ok); }
  #status.err{ color:var(--accent); }
  .list-item{
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 0; border-bottom:1px solid #23262f; font-size:14px;
  }
  .list-item:last-child{ border-bottom:none; }
  .list-item button{
    width:auto; margin:0; padding:6px 12px; font-size:12px;
    background:transparent; border:1px solid #2a2e38; color:var(--muted);
  }
  .list-item button:hover{ color:var(--accent); border-color:var(--accent); }
  small.hint{ color:var(--muted); display:block; margin-top:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Chill<span>Cinema</span> Admin</h1>
  <p class="sub">Add or delete custom streaming entries directly to your GitHub repository storage.</p>

  <div class="card">
    <label>Repository &amp; Branch Path Configuration</label>
    <input id="repo" value="Pujanpraja/worldcup" disabled style="opacity: 0.6; cursor: not-allowed;">
    
    <label style="margin-top: 10px;">Branch</label>
    <input id="branch" value="main" disabled style="opacity: 0.6; cursor: not-allowed;">

    <label style="margin-top: 14px;">Personal Access Token <small class="hint">Fine-grained token with Content: Read & Write</small></label>
    <input id="token" type="password" placeholder="github_pat_...">

    <button class="secondary" onclick="connect()">Connect &amp; Sync Library</button>
    <div id="status"></div>
  </div>

  <div class="card" id="add-card" style="display:none;">
    <label>Title</label>
    <input id="title" placeholder="Movie title">

    <label>Video Player URL / YouTube ID</label>
    <input id="youtubeId" placeholder="https://yapgrid.com... OR YouTube code">

    <label>Card Poster Image URL (Optional)</label>
    <input id="thumbnailUrl" placeholder="https://example.com">

    <label>Description (Optional)</label>
    <textarea id="description" placeholder="Short display overview..."></textarea>

    <button onclick="addMovie()" id="add-btn">Publish to Library</button>
  </div>

  <div class="card" id="list-card" style="display:none;">
    <label style="margin-top:0;">Current Catalog Entries</label>
    <div id="movie-list"></div>
  </div>
</div>

<script>
  let sha = null;
  let movies = [];

  function setStatus(msg, type) {
    const el = document.getElementById('status');
    el.textContent = msg;
    el.className = type || '';
  }

  function ghHeaders() {
    return {
      'Authorization': 'token ' + document.getElementById('token').value.trim(),
      'Accept': 'application/vnd.github.v3+json'
    };
  }

  function apiUrl() {
    return `https://github.com`;
  }

  async function connect() {
    setStatus('Connecting to GitHub repository API vectors...');
    try {
      const res = await fetch(apiUrl() + '?ref=main', { headers: ghHeaders() });
      if (!res.ok) throw new Error(`API error ${res.status}`);
      const data = await res.json();
      sha = data.sha;
      movies = JSON.parse(decodeURIComponent(escape(atob(data.content))));
      renderList();
      document.getElementById('add-card').style.display = 'block';
      document.getElementById('list-card').style.display = 'block';
      setStatus('Successfully synced ' + movies.length + ' movie entries.', 'ok');
    } catch (e) {
      setStatus('Sync Connection Failed. Ensure your fine-grained token has "Contents: Read & Write" scopes enabled.', 'err');
    }
  }

  function renderList() {
    const el = document.getElementById('movie-list');
    el.innerHTML = movies.length === 0 ? '<p style="color:var(--muted);font-size:13px;">No entries available.</p>' : '';
    movies.forEach((m, i) => {
      const row = document.createElement('div');
      row.className = 'list-item';
      row.innerHTML = `<span>${escapeHtml(m.title)}</span>`;
      const btn = document.createElement('button');
      btn.textContent = 'Delete';
      btn.onclick = () => removeMovie(i);
      row.appendChild(btn);
      el.appendChild(row);
    });
  }

  async function commit(commitMessage) {
    const body = {
      message: commitMessage,
      content: btoa(unescape(encodeURIComponent(JSON.stringify(movies, null, 2)))),
      sha: sha, 
      branch: "main"
    };
    const res = await fetch(apiUrl(), { method: 'PUT', headers: ghHeaders(), body: JSON.stringify(body) });
    if (!res.ok) throw new Error(`Upload fault`);
    const data = await res.json();
    sha = data.content.sha;
  }

  async function addMovie() {
    const title = document.getElementById('title').value.trim();
    const youtubeId = document.getElementById('youtubeId').value.trim();
    const thumbnailUrl = document.getElementById('thumbnailUrl').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!title || !youtubeId) { setStatus('Title and Video resource elements are mandatory.', 'err'); return; }

    const btn = document.getElementById('add-btn');
    btn.disabled = true;
    setStatus('Pushing layout updates to GitHub server branch array...');

    movies.push({ id: 'm-' + Date.now(), title, youtubeId, thumbnailUrl, description, addedAt: new Date().toISOString().slice(0,10) });

    try {
      await commit(`Add entry: "${title}"`);
      renderList();
      document.getElementById('title').value = '';
      document.getElementById('youtubeId').value = '';
      document.getElementById('thumbnailUrl').value = '';
      document.getElementById('description').value = '';
      setStatus('Success! Posted database files. Changes propagate globally within 1 minute.', 'ok');
    } catch (e) {
      movies.pop();
      setStatus('Write access failed.', 'err');
    } finally { btn.disabled = false; }
  }

  async function removeMovie(index) {
    const removed = movies[index];
    movies.splice(index, 1);
    try {
      await commit(`Dropped catalog link item: "${removed.title}"`);
      renderList();
      setStatus('Removed successfully.', 'ok');
    } catch (e) {
      movies.splice(index, 0, removed);
      renderList();
      setStatus('Removal request failed.', 'err');
    }
  }

  function escapeHtml(str) {
    return String(str).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
  }
</script>
</body>
</html>
